services:
  vm1-initiator:
    build:
      context: ./docker
      dockerfile: Dockerfile.testbed-node
    image: ipsec-testbed-node:latest
    container_name: vm1-initiator
    hostname: vm1-initiator
    ports:
      - "2201:22"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: >-
      sh -c "ip route replace 192.168.57.20/32 via 192.168.56.1 &&
      exec /usr/sbin/sshd -D"
    networks:
      testbed_initiator:
        ipv4_address: 192.168.56.10
    restart: unless-stopped

  vm2-responder:
    build:
      context: ./docker
      dockerfile: Dockerfile.testbed-node
    image: ipsec-testbed-node:latest
    container_name: vm2-responder
    hostname: vm2-responder
    ports:
      - "2202:22"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: >-
      sh -c "ip route replace 192.168.56.10/32 via 192.168.57.1 &&
      exec /usr/sbin/sshd -D"
    networks:
      testbed_responder:
        ipv4_address: 192.168.57.20
    restart: unless-stopped

  vm3-observer:
    build:
      context: ./docker
      dockerfile: Dockerfile.testbed-node
    image: ipsec-testbed-node:latest
    container_name: vm3-observer
    hostname: vm3-observer
    ports:
      - "2203:22"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      testbed_initiator:
        ipv4_address: 192.168.56.1
      testbed_responder:
        ipv4_address: 192.168.57.1
    restart: unless-stopped

  # Dedicated node for controlled attack telemetry simulations. It reuses the
  # existing testbed image, so no additional security toolkit is installed.
  vm4-attacker:
    build:
      context: ./docker
      dockerfile: Dockerfile.testbed-node
    image: ipsec-testbed-node:latest
    container_name: vm4-attacker
    hostname: vm4-attacker
    ports:
      - "2204:22"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      testbed_initiator:
        ipv4_address: 192.168.56.40
    restart: unless-stopped

networks:
  testbed_initiator:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.56.0/24
          gateway: 192.168.56.254
  testbed_responder:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.57.0/24
          gateway: 192.168.57.254
