# IPsec VPN Security Assessment Baseline Policy

policy_name: "Corporate Standard Context-Aware IPsec Security Policy"
version: "2.0"

encryption:
  approved:
    - "AES-256-GCM"
    - "AES-128-GCM"
    - "AES-256-CBC"
    - "ENCR_AES_GCM_16"
    - "ENCR_AES_CBC"
  forbidden:
    - "DES"
    - "3DES"
    - "NULL"
    - "RC4"
  min_key_length: 128

dh_groups:
  approved:
    - 14  # 2048-bit MODP
    - 19  # 256-bit ECP (Group 19)
    - 20  # 384-bit ECP (Group 20)
    - 21  # 521-bit ECP (Group 21)
    - 28  # Curve25519
  forbidden:
    - 1   # 768-bit MODP
    - 2   # 1024-bit MODP
    - 5   # 1536-bit MODP

integrity:
  approved:
    - "AEAD"
    - "HMAC-SHA2-256"
    - "HMAC-SHA2-384"
    - "HMAC-SHA2-512"
    - "AUTH_HMAC_SHA2_256_128"
    - "AUTH_HMAC_SHA2_384_192"
    - "AUTH_HMAC_SHA2_512_256"
  forbidden:
    - "MD5"
    - "SHA1"
    - "AUTH_HMAC_MD5_96"
    - "AUTH_HMAC_SHA1_96"

prf:
  approved:
    - "HMAC-SHA2-256"
    - "HMAC-SHA2-384"
    - "HMAC-SHA2-512"
    - "PRF_HMAC_SHA2_256"
    - "PRF_HMAC_SHA2_384"
    - "PRF_HMAC_SHA2_512"
  forbidden:
    - "MD5"
    - "SHA1"

protocol:
  approved_versions:
    - "IKEv2"
  disapproved_versions:
    - "IKEv1"

pfs:
  required: true

replay_protection:
  required: true

# Context-Aware Traffic Baselines
traffic_specific_baselines:
  VOIP:
    recommended_cipher_type: "AEAD"
    reason: "VoIP and real-time audio demand low-latency AEAD ciphers (AES-GCM) to prevent audio jitter and packet delay."
  VPN-VOIP:
    recommended_cipher_type: "AEAD"
    reason: "VoIP traffic demands low-latency AEAD ciphers (AES-GCM) to prevent jitter."
  FT:
    pfs_recommendation: "PFS Enforced"
    reason: "Bulk file transfers carry high volumes of sensitive data; enforcing PFS prevents retrospective decryption."
  VPN-FT:
    pfs_recommendation: "PFS Enforced"
    reason: "Bulk file transfers carry high volumes of sensitive data; enforcing PFS prevents retrospective decryption."

risk_weights:
  HIGH: 30
  MEDIUM: 15
  LOW: 5
