services:
  ipsec-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipsec-analyzer:latest
    container_name: ipsec_analyzer_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./results:/app/results
      - ./config:/app/config:ro
      - ./captures:/app/captures
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
